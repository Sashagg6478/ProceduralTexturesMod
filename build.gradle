plugins {
    id 'net.neoforged.moddev' version '2.0.5-beta' // или твоя версия
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
    gradleVersion = '8.8'
}

version = '1.0.0'
group = 'net.sanya.procedural'

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

base {
    archivesName = 'ProceduralTexturesMod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.0.167'

    mods {
        proceduraltexturesmod {
            sourceSet(sourceSets.main)
        }
    }
}
